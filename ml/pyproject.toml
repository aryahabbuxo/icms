[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icms_ml"
version = "0.1.0"
description = "ICMS NLP/ML: classification, NER, embeddings, duplicate detection, fraud scoring, OCR, NL-to-SQL"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.4", "pandas>=2.1", "numpy>=1.26", "joblib>=1.3"]

[tool.setuptools]
packages = ["icms_ml"]
