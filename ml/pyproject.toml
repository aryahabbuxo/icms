[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icms_ml"
version = "0.1.0"
description = "ICMS NLP/ML: classification, NER, embeddings, duplicate detection, fraud scoring, OCR, NL-to-SQL"
requires-python = ">=3.10"
dependencies = []   # real deps live in requirements.txt; stubs need nothing

[tool.setuptools]
packages = ["icms_ml"]
